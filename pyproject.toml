[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chirp"
version = "0.1.0"
description = "Local spoken outlines from synchronous Codex and Claude Code Stop hooks"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["piper-tts==1.8.0", "sounddevice==0.5.5"]

[project.scripts]
chirp = "chirp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
